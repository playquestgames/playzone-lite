<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Words - Inglés</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <script src="core_system.js"></script>
    <style>
        :root {
            --pink: #ff69b4;
            --purple: #8a2be2;
            --cyan: #00ffff;
            --gold: #ffd700;
            --green: #10b981;
            --bg: #064e3b;
        }

        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, var(--bg), #047857);
            color: white;
            font-family: 'Fredoka One', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header { text-align: center; margin-bottom: 20px; z-index: 10;}
        h1 { font-size: 3.5rem; color: var(--gold); text-shadow: 0 0 15px rgba(255,215,0,0.5); margin: 0; }
        .subtitle { font-family: 'Nunito', sans-serif; font-size: 1.2rem; color: var(--cyan); }

        .game-area {
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 40px;
            border: 4px solid var(--green);
            box-shadow: 0 0 30px rgba(16,185,129,0.3);
            text-align: center;
            max-width: 800px;
            width: 100%;
        }

        .speaker-btn {
            background: var(--pink);
            border: none;
            border-radius: 50%;
            width: 120px; height: 120px;
            font-size: 4rem;
            cursor: pointer;
            box-shadow: 0 8px 0 #be185d;
            transition: 0.2s;
            margin-bottom: 30px;
            animation: pulse 2s infinite;
        }
        .speaker-btn:hover { transform: translateY(-5px); box-shadow: 0 12px 0 #be185d; }
        .speaker-btn:active { transform: translateY(5px); box-shadow: 0 0 0 #be185d; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .animal-card {
            background: white;
            color: black;
            border-radius: 20px;
            padding: 20px;
            cursor: pointer;
            transition: 0.3s;
            border: 4px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .animal-card:hover { transform: scale(1.05); border-color: var(--cyan); }
        .animal-emoji { font-size: 5rem; margin-bottom: 10px; }
        .animal-name { font-size: 1.8rem; text-transform: uppercase; color: var(--purple); }

        .btn-back {
            margin-top: 30px;
            padding: 12px 30px;
            background: rgba(0,0,0,0.5);
            color: white;
            border: 2px solid white;
            border-radius: 20px;
            font-family: 'Fredoka One', cursive;
            font-size: 1.2rem;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
        }
        .btn-back:hover { background: var(--pink); transform: scale(1.1); }
    </style>
</head>
<body>
    <div class="header">
        <h1>🐾 Animal Words</h1>
        <div class="subtitle">Escucha y toca el animal correcto</div>
    </div>

    <div class="game-area">
        <button class="speaker-btn" onclick="playCurrentWord()">🔊</button>
        
        <div class="cards-grid" id="cards">
            <!-- Cards generated by JS -->
        </div>
    </div>

    <a href="index.html" class="btn-back">⬅ VOLVER AL CASTILLO</a>

    <script>
        const animals = [
            { en: "Dog", es: "Perro", emoji: "🐶" },
            { en: "Cat", es: "Gato", emoji: "🐱" },
            { en: "Pig", es: "Cerdo", emoji: "🐷" },
            { en: "Cow", es: "Vaca", emoji: "🐮" },
            { en: "Bird", es: "Pájaro", emoji: "🐦" },
            { en: "Fish", es: "Pez", emoji: "🐟" },
            { en: "Horse", es: "Caballo", emoji: "🐴" },
            { en: "Monkey", es: "Mono", emoji: "🐒" },
            { en: "Lion", es: "León", emoji: "🦁" },
            { en: "Bear", es: "Oso", emoji: "🐻" }
        ];

        let currentAnimal = null;
        let isSpeaking = false;
        let roundsPlayed = 0;

        function speak(text, lang = 'es-ES', pitch = 1.2) {
            try {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const msg = new SpeechSynthesisUtterance(text);
                    msg.lang = lang;
                    msg.pitch = pitch;
                    window.speechSynthesis.speak(msg);
                }
            } catch(e) {}
        }

        function playCurrentWord() {
            if (currentAnimal) {
                // English pronunciation
                speak(currentAnimal.en, 'en-US', 1.1);
            }
        }

        function generateRound() {
            // Pick 4 random animals
            let shuffled = [...animals].sort(() => 0.5 - Math.random());
            let choices = shuffled.slice(0, 4);
            
            // Pick 1 as the answer
            currentAnimal = choices[Math.floor(Math.random() * choices.length)];

            const grid = document.getElementById('cards');
            grid.innerHTML = '';

            choices.forEach(animal => {
                const card = document.createElement('div');
                card.className = 'animal-card';
                card.innerHTML = `
                    <div class="animal-emoji">${animal.emoji}</div>
                    <div class="animal-name">${animal.en}</div>
                `;
                card.onclick = () => checkAnswer(animal, card);
                grid.appendChild(card);
            });

            // Automatically play the word after a short delay
            setTimeout(playCurrentWord, 600);
        }

        function checkAnswer(selected, cardElement) {
            if (selected.en === currentAnimal.en) {
                cardElement.style.borderColor = '#10b981';
                cardElement.style.background = '#d1fae5';
                
                CoreSystem.addStars(2);
                speak("¡Excelente! " + selected.es, 'es-ES', 1.3);
                
                confetti();
                roundsPlayed++;
                if (roundsPlayed % 5 === 0) {
                    setTimeout(() => {
                        CoreSystem.suggestRotation({
                            title: "¡Great job!",
                            msg: "Te sabes los animales súper bien en inglés. ¿Visitamos la Boutique o otro juego?"
                        });
                    }, 1500);
                } else {
                    setTimeout(generateRound, 1500);
                }
            } else {
                cardElement.style.borderColor = '#ef4444';
                cardElement.style.background = '#fee2e2';
                cardElement.animate([
                    { transform: 'translateX(-5px)' },
                    { transform: 'translateX(5px)' },
                    { transform: 'translateX(0)' }
                ], { duration: 300 });
                speak("¡Casi! Escucha otra vez.", 'es-ES', 1.0);
                setTimeout(() => {
                    cardElement.style.borderColor = 'transparent';
                    cardElement.style.background = 'white';
                    playCurrentWord();
                }, 1000);
            }
        }

        function confetti() {
            for (let i = 0; i < 20; i++) {
                const dot = document.createElement('div');
                dot.style.cssText = `position:fixed;left:50%;top:50%;width:15px;height:15px;font-size:20px;pointer-events:none;z-index:9999;`;
                dot.textContent = '⭐';
                document.body.appendChild(dot);
                const a = Math.random() * Math.PI * 2;
                const d = Math.random() * 200 + 100;
                dot.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px)`,opacity:0}],{duration:1000,easing:'ease-out'}).onfinish = () => dot.remove();
            }
        }

        window.addEventListener('load', () => {
            generateRound();
            setTimeout(() => {
                speak("¡Bienvenida a la clase de inglés! Toca el botón para escuchar al animal.", 'es-ES');
            }, 500);
        });
    </script>
</body>
</html>
