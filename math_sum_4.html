<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sumas a las Nubes - 4 Dígitos</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <script src="core_system.js"></script>
    <style>
        :root {
            --pink: #ff69b4;
            --purple: #7c3aed;
            --cyan: #06b6d4;
            --gold: #fbbf24;
            --white: #ffffff;
            --bg-color: #0ea5e9; /* Sky blue */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Fredoka One', cursive;
            background-color: var(--bg-color);
            background-image: linear-gradient(to bottom, #0284c7, #38bdf8);
            color: var(--white);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Nubes de fondo */
        .cloud {
            position: absolute;
            background: white;
            border-radius: 50px;
            opacity: 0.8;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1));
            z-index: -1;
            animation: float 20s linear infinite;
        }

        @keyframes float {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-200px); }
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            z-index: 10;
        }

        h1 {
            font-size: 3rem;
            color: var(--gold);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 5px;
        }

        .subtitle {
            font-family: 'Nunito', sans-serif;
            font-size: 1.2rem;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .game-container {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
        }

        .math-board {
            background: white;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            border: 5px solid var(--purple);
            color: #333;
            font-size: 2.5rem;
            display: inline-block;
        }

        /* Estructura de la suma */
        .math-grid {
            display: grid;
            grid-template-columns: auto repeat(4, 1fr);
            gap: 10px;
            text-align: center;
            align-items: center;
        }

        .column-label {
            font-size: 1rem;
            color: var(--purple);
            font-family: 'Nunito', sans-serif;
            font-weight: 900;
        }

        /* Llevando (carry over) */
        .carry-row { margin-bottom: 10px; }
        .carry-input {
            width: 40px; height: 40px;
            border-radius: 50%;
            border: 2px dashed #ccc;
            text-align: center;
            font-size: 1.5rem;
            font-family: 'Fredoka One', cursive;
            background: #f8fafc;
            color: var(--pink);
            transition: 0.3s;
        }
        .carry-input:focus { border-color: var(--pink); outline: none; background: #fdf2f8; }
        .carry-input.correct { border-color: #22c55e; background: #dcfce7; color: #166534; border-style: solid; }

        .number-row { font-size: 3.5rem; letter-spacing: 15px; text-align: right; margin-right: 15px;}
        
        .operator { font-size: 3.5rem; color: var(--pink); margin-right: 10px; }

        .line {
            grid-column: 1 / 6;
            height: 5px;
            background: var(--purple);
            margin: 10px 0;
            border-radius: 5px;
        }

        /* Resultado */
        .result-input {
            width: 50px; height: 60px;
            border-radius: 10px;
            border: 3px solid #ccc;
            text-align: center;
            font-size: 3rem;
            font-family: 'Fredoka One', cursive;
            transition: 0.3s;
        }
        .result-input:focus { border-color: var(--cyan); outline: none; background: #ecfeff; }
        .result-input.correct { border-color: #22c55e; background: #dcfce7; color: #166534; }
        .result-input.wrong { border-color: #ef4444; background: #fee2e2; color: #991b1b; animation: shake 0.5s; }

        /* Torre / Recompensa */
        .tower-container {
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            width: 200px;
            height: 400px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            border: 3px dashed rgba(255,255,255,0.5);
            padding: 10px;
        }

        .tower-block {
            width: 100%;
            height: 60px;
            background: linear-gradient(45deg, var(--gold), #fde047);
            border-radius: 10px;
            border: 3px solid white;
            margin-top: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            color: #b45309;
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
            animation: dropIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes dropIn {
            0% { transform: translateY(-100px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .scratchpad-container {
            background: rgba(255,255,255,0.9);
            padding: 15px;
            border-radius: 20px;
            border: 4px dashed var(--cyan);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.3);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 20px;
            border: 2px solid white;
            transition: 0.3s;
            z-index: 100;
        }

        .back-btn:hover { background: var(--pink); transform: scale(1.1); }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        .btn-check {
            grid-column: 1 / 6;
            margin-top: 20px;
            padding: 15px;
            background: var(--pink);
            color: white;
            border: none;
            border-radius: 20px;
            font-family: 'Fredoka One', cursive;
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 5px 0 #be185d;
        }
        .btn-check:hover { transform: translateY(-3px); box-shadow: 0 8px 0 #be185d; }
        .btn-check:active { transform: translateY(2px); box-shadow: 0 2px 0 #be185d; }

        .hidden { display: none; }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">⬅️ Volver al Reino</a>

    <div class="header">
        <h1>☁️ Sumas a las Nubes</h1>
        <div class="subtitle">Suma de derecha a izquierda. ¡No olvides lo que llevas!</div>
    </div>

    <div class="game-container">
        
        <div class="math-board">
            <div class="math-grid">
                <!-- Etiquetas de columnas -->
                <div></div>
                <div class="column-label">UM</div>
                <div class="column-label">C</div>
                <div class="column-label">D</div>
                <div class="column-label">U</div>

                <!-- Llevando (Carries) -->
                <div></div>
                <input type="text" maxlength="1" class="carry-input" id="carry-3">
                <input type="text" maxlength="1" class="carry-input" id="carry-2">
                <input type="text" maxlength="1" class="carry-input" id="carry-1">
                <div></div> <!-- Las unidades no llevan nada de antes -->

                <!-- Primer número -->
                <div></div>
                <div class="number-row" id="n1-3" style="grid-column: 2">0</div>
                <div class="number-row" id="n1-2" style="grid-column: 3">0</div>
                <div class="number-row" id="n1-1" style="grid-column: 4">0</div>
                <div class="number-row" id="n1-0" style="grid-column: 5">0</div>

                <!-- Segundo número -->
                <div class="operator">➕</div>
                <div class="number-row" id="n2-3" style="grid-column: 2">0</div>
                <div class="number-row" id="n2-2" style="grid-column: 3">0</div>
                <div class="number-row" id="n2-1" style="grid-column: 4">0</div>
                <div class="number-row" id="n2-0" style="grid-column: 5">0</div>

                <!-- Línea -->
                <div class="line"></div>

                <!-- Resultado -->
                <div></div>
                <input type="text" maxlength="1" class="result-input" id="res-3" style="grid-column: 2">
                <input type="text" maxlength="1" class="result-input" id="res-2" style="grid-column: 3">
                <input type="text" maxlength="1" class="result-input" id="res-1" style="grid-column: 4">
                <input type="text" maxlength="1" class="result-input" id="res-0" style="grid-column: 5">

                <button class="btn-check" id="btn-check" onclick="checkMath()">¡Comprobar!</button>
                <button class="btn-check hidden" id="btn-next" onclick="nextProblem()" style="background: #22c55e; box-shadow: 0 5px 0 #166534;">Siguiente Suma 🚀</button>
            </div>
        </div>

        <div class="tower-container" id="tower">
            <div style="color:white; font-family:'Nunito',sans-serif; text-align:center; opacity:0.5; margin-bottom: auto;">Tu Torre Estelar</div>
        </div>

        <div class="scratchpad-container">
            <div style="display:flex; justify-content:space-between; align-items:center; width: 100%; margin-bottom:10px;">
                <span style="color:var(--cyan); font-size:1.2rem; text-shadow:none;">✏️ Pizarra Mágica</span>
                <button onclick="clearScratchpad()" style="background:var(--pink); color:white; border:none; border-radius:10px; cursor:pointer; padding:5px 15px; font-family:'Fredoka One',cursive;">Borrar</button>
            </div>
            <canvas id="scratchpad" width="220" height="340" style="background:white; border-radius:10px; border:2px solid #ccc; cursor:crosshair; touch-action:none;"></canvas>
        </div>

    </div>

    <script>
        // --- Nubes ---
        for(let i=0; i<5; i++) {
            let cloud = document.createElement('div');
            cloud.className = 'cloud';
            cloud.style.width = (Math.random() * 150 + 100) + 'px';
            cloud.style.height = (Math.random() * 40 + 40) + 'px';
            cloud.style.top = (Math.random() * 50) + '%';
            cloud.style.animationDuration = (Math.random() * 20 + 20) + 's';
            cloud.style.animationDelay = (Math.random() * -20) + 's';
            document.body.appendChild(cloud);
        }

        // --- Pizarra Mágica ---
        const canvas = document.getElementById('scratchpad');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let lastX = 0, lastY = 0;

        function getMousePos(evt) {
            const rect = canvas.getBoundingClientRect();
            const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
            const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startDrawing(e) {
            isDrawing = true;
            const pos = getMousePos(e);
            lastX = pos.x; lastY = pos.y;
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getMousePos(e);
            
            ctx.strokeStyle = '#ff69b4';
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.lineWidth = 4;
            
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            
            lastX = pos.x; lastY = pos.y;
        }

        function stopDrawing() { isDrawing = false; }
        function clearScratchpad() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing, {passive: false});
        canvas.addEventListener('touchmove', draw, {passive: false});
        canvas.addEventListener('touchend', stopDrawing);

        let num1 = [];
        let num2 = [];
        let correctAnswer = [];
        let carries = [];
        let blocksEarned = 0;
        let roundsPlayed = 0;

        function speak(text) {
            try {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const msg = new SpeechSynthesisUtterance(text);
                    msg.lang = 'es-ES';
                    msg.rate = 0.9;
                    msg.pitch = 1.3;
                    window.speechSynthesis.speak(msg);
                }
            } catch(e){}
        }

        function generateProblem() {
            // Generar 4 dígitos (0-9). Evitamos que la suma total se pase a 5 dígitos (max UM sum = 9)
            num1 = [
                Math.floor(Math.random() * 10), // U
                Math.floor(Math.random() * 10), // D
                Math.floor(Math.random() * 10), // C
                Math.floor(Math.random() * 5) + 1 // UM (1-5)
            ];
            num2 = [
                Math.floor(Math.random() * 10), // U
                Math.floor(Math.random() * 10), // D
                Math.floor(Math.random() * 10), // C
                Math.floor(Math.random() * 4) + 1 // UM (1-4)
            ];

            // Calcular respuestas y acarreos (carries)
            carries = [0, 0, 0, 0];
            correctAnswer = [0, 0, 0, 0];
            
            let carry = 0;
            for (let i = 0; i < 4; i++) {
                let sum = num1[i] + num2[i] + carry;
                correctAnswer[i] = sum % 10;
                carry = Math.floor(sum / 10);
                if(i < 3) carries[i+1] = carry; // El carry de i pasa a i+1
            }

            // Actualizar UI
            for(let i=0; i<4; i++) {
                document.getElementById(`n1-${i}`).textContent = num1[i];
                document.getElementById(`n2-${i}`).textContent = num2[i];
                
                let resInput = document.getElementById(`res-${i}`);
                resInput.value = "";
                resInput.className = "result-input";
                resInput.disabled = false;

                if (i > 0) {
                    let carryInput = document.getElementById(`carry-${i}`);
                    carryInput.value = "";
                    carryInput.className = "carry-input";
                    carryInput.disabled = false;
                }
            }

            document.getElementById('btn-check').classList.remove('hidden');
            document.getElementById('btn-next').classList.add('hidden');
            
            // Foco en las unidades
            document.getElementById('res-0').focus();
        }

        // Permitir saltar entre inputs al escribir
        for(let i=0; i<4; i++) {
            document.getElementById(`res-${i}`).addEventListener('input', function(e) {
                if(this.value.length === 1) {
                    // Si hay carry para la siguiente, ir al carry
                    if(i < 3) {
                        document.getElementById(`carry-${i+1}`).focus();
                    } else {
                        document.getElementById('btn-check').focus();
                    }
                }
            });

            if(i > 0) {
                document.getElementById(`carry-${i}`).addEventListener('input', function(e) {
                    if(this.value.length === 1) {
                        // Después del carry, bajar al resultado de la misma columna
                        document.getElementById(`res-${i}`).focus();
                    }
                });
            }
        }

        function checkMath() {
            let allCorrect = true;

            // Revisar Resultados
            for(let i=0; i<4; i++) {
                let el = document.getElementById(`res-${i}`);
                if(el.value == correctAnswer[i]) {
                    el.classList.add('correct');
                    el.classList.remove('wrong');
                    el.disabled = true;
                } else {
                    el.classList.add('wrong');
                    el.classList.remove('correct');
                    allCorrect = false;
                }
            }

            // Revisar Carries (Acarreos)
            for(let i=1; i<4; i++) {
                let el = document.getElementById(`carry-${i}`);
                let expectedCarry = carries[i];
                // Si se esperaba 0, el niño puede dejarlo vacío o poner 0
                let userCarry = el.value === "" ? 0 : parseInt(el.value);
                
                if(userCarry === expectedCarry) {
                    el.classList.add('correct');
                    el.classList.remove('wrong');
                    el.disabled = true;
                } else {
                    el.classList.add('wrong');
                    el.classList.remove('correct');
                    allCorrect = false;
                }
            }

            if(allCorrect) {
                CoreSystem.addStars(5);
                speak('¡Excelente! Has resuelto la suma perfectamente.');
                document.getElementById('btn-check').classList.add('hidden');
                document.getElementById('btn-next').classList.remove('hidden');
                addTowerBlock();
                confetti();

                roundsPlayed++;
                if (roundsPlayed % 3 === 0) {
                    setTimeout(() => {
                        CoreSystem.suggestRotation({
                            title: "¡Gran Constructora!",
                            msg: "Has hecho crecer mucho la torre. ¿Qué tal si visitamos la Boutique para gastar las estrellas?"
                        });
                    }, 1500);
                }
            } else {
                speak('Algo no está bien. Revisa tus números, recuerda sumar de derecha a izquierda.');
            }
        }

        function nextProblem() {
            generateProblem();
        }

        function addTowerBlock() {
            blocksEarned++;
            const tower = document.getElementById('tower');
            const block = document.createElement('div');
            block.className = 'tower-block';
            block.textContent = `⭐ ${blocksEarned} ⭐`;
            tower.appendChild(block);
        }

        function confetti() {
            for (let i = 0; i < 30; i++) {
                const dot = document.createElement('div');
                dot.style.cssText = `position:fixed;left:50%;top:50%;width:10px;height:10px;border-radius:50%;background:hsl(${Math.random()*360},100%,50%);pointer-events:none;z-index:9999;`;
                document.body.appendChild(dot);
                const a = Math.random() * Math.PI * 2;
                const d = Math.random() * 200 + 80;
                dot.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px)`,opacity:0}],{duration:1000,easing:'ease-out'}).onfinish = () => dot.remove();
            }
        }

        window.addEventListener('load', () => {
            generateProblem();
            setTimeout(() => {
                speak('Vamos a construir la torre de estrellas sumando. Recuerda empezar por las unidades, a la derecha.');
            }, 500);
        });
    </script>
</body>
</html>
